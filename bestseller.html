<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롬앤 메인화면 베스트셀러</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
</head>

<body>
    <div class="product-card">
        <button class="product-visual" type="button" aria-label="제품 이미지와 모델 이미지 전환">
            <img class="product-image-default" src="./img/lip-list-img-1.jpg" alt="제품 이미지">
            <img class="product-image-model" src="./img/lip-list-model-img-1.png" alt="제품 모델 이미지">
            <span class="rank">1</span>
        </button>

        <div class="product-info">
            <h2 class="product-name">글래스팅 멜팅 밤</h2>
            <p class="price-original">13,000원</p>
            <p class="discount">28%</p>
            <p class="price-discount">9,400원</p>

            <div class="color-chip">
                <div class="color-scroll">
                </div>
            </div>

            <span class="badge">BEST</span>
        </div>
    </div>
</body>

</html>
