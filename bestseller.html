<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롬앤 메인화면 베스트셀러</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">

    <!-- 가져가야할 코드 -->
    <link rel="stylesheet" href="./css/bestseller.css">
    <script src="./js/product-bestseller.js" defer></script>
    <script src="./js/product-control.js" defer></script>
</head>

<body>
    <div class="bestseller">
        <h1>BEST SELLER</h1>
        <ul class="product-card">
            <li class="product-card-list">
                <a href="#" class="product-visual">
                    <span class="rank">1</span>
                    <div>
                        <img class="product-img" src="./img/lip-list-img-1.jpg" alt="제품 이미지">
                        <img class="product-img-model" src="./img/lip-list-model-img-1.jpg" alt="제품 모델 이미지">
                    </div>
                </a>
                <div class="product-txt">
                    <h2 class="product-name">글래스팅 멜팅 밤</h2>
                    <p class="price-original"><span>13,000</span>원</p>
                    <div class="discount-txt">
                        <p class="discount">28%</p>
                        <p class="price-discount"><span>9,400</span>원</p>
                    </div>
                </div>
                <div class="color-chip">
                    <span class="color-scroll"></span>
                </div>
                <div class="badges">
                    <span class="badge best">BEST</span>
                    <span class="badge new">NEW</span>
                </div>
            </li>
        </ul>
        <div class="bestseller-btn">
            <a href="#">VIEW MORE</a>
        </div>
    </div>
</body>

</html>
