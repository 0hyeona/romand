<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 추천상품</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/product-recommend.css">
    <script src="./js/product-recommend.js" defer></script>
    <script src="./js/product-recommend-control.js" defer></script>
    <script src="./js/product-recommend-popup.js" defer></script>
</head>

<body>
    <div class="recommend-modal"></div>
    <div class="recommend-popup">
        <div class="popup-ctl">
            <p>옵션을 선택해 주세요</p>
            <!-- 수정: 닫기 버튼의 기본 접근성 속성을 HTML로 이동 -->
            <span class="popup-close" role="button" tabindex="0" aria-label="팝업 닫기">X</span>
        </div>
        <div class="product-info">
            <figure class="product-img">
                <img src="./img/lip-list-model-img-1.jpg" alt="롬앤 글래스팅 컬러 글로스">
            </figure>
            <div class="popup-product-txt">
                <span class="popup-product-name">롬앤 글래스팅 컬러 글로스</span>
                <span class="popup-product-price">9,400원</span>
            </div>
        </div>
        <div class="option">
            <div class="option-title">필수</div>
            <div class="select-option">
                <!-- 수정: 옵션 열림 상태와 연결할 목록을 HTML에 선언 -->
                <div class="option-toggle" role="button" tabindex="0" aria-expanded="false" aria-haspopup="listbox" aria-controls="recommend-option-list">
                    <span class="selected-option">옵션을 선택해 주세요</span>
                    <span class="option-arrow">
                        <img src="./img/up-arrow.svg" alt="옵션 열고닫기 아이콘">
                    </span>
                </div>
                <!-- 수정: 옵션 목록은 처음에 숨기고 기본 접근성 속성을 선언 -->
                <ul class="option-list" id="recommend-option-list" role="listbox" aria-label="상품 옵션" hidden>
                    <!-- 수정: 옵션 항목의 키보드 접근 및 초기 선택 상태 -->
                    <li role="option" tabindex="0" aria-selected="false">
                        <span class="option-color"></span>피오니 발레
                    </li>
                    <!-- 수정: 옵션 항목의 키보드 접근 및 초기 선택 상태 -->
                    <li role="option" tabindex="0" aria-selected="false">
                        <span class="option-color"></span>너티 베이그
                    </li>
                    <!-- 수정: 옵션 항목의 키보드 접근 및 초기 선택 상태 -->
                    <li role="option" tabindex="0" aria-selected="false">
                        <span class="option-color"></span>로즈 핀치
                    </li>
                    <!-- 수정: 옵션 항목의 키보드 접근 및 초기 선택 상태 -->
                    <li role="option" tabindex="0" aria-selected="false">
                        <span class="option-color"></span>그레이피 웨이
                    </li>
                    <!-- 수정: 옵션 항목의 키보드 접근 및 초기 선택 상태 -->
                    <li role="option" tabindex="0" aria-selected="false">
                        <span class="option-color"></span>딤 모브
                    </li>
                    <!-- 수정: 옵션 항목의 키보드 접근 및 초기 선택 상태 -->
                    <li role="option" tabindex="0" aria-selected="false">
                        <span class="option-color"></span>디픈 무어
                    </li>
                </ul>
            </div>
        </div>
        <!-- 수정: 담기 버튼의 기본 속성을 HTML로 이동 (비활성화 없음) -->
        <div class="incart" role="button" tabindex="0">담기</div>
    </div>
    <div class="product-recommend">
        <h1>추천 상품</h1>
        <div class="product-card-list-wrap">
            <ul class="product-card">
                <li class="product-card-list">
                    <a href="#" class="product-visual">
                        <img class="product-img" src="./img/lip-list-img-1.jpg" alt="제품 이미지">
                        <img class="product-img-model" src="./img/lip-list-model-img-1.jpg" alt="제품 모델 이미지">
                    </a>
                    <div class="product-txt">
                        <h2 class="product-name">쥬시 플래시 립 오일(+롬앤 립 랜덤 1종 증정)</h2>
                        <p class="price-original"><span>14,000</span>원</p>
                        <div class="discount-txt">
                            <p class="discount">22%</p>
                            <p class="price-discount"><span>10,900</span>원</p>
                        </div>
                    </div>
                    <div class="color-chip ">
                        <div class="color-scroll" aria-label="쥬시 플래시 립 오일(+롬앤 립 랜덤 1종 증정) 전체 컬러">
                        </div>
                    </div>
                    <div class="badges">
                        <span class="badge best off">BEST</span>
                        <span class="badge new on">NEW</span>
                    </div>
                    <!-- 수정: 담기 버튼의 키보드 접근 속성을 HTML로 이동 -->
                    <div id="popup-open" role="button" tabindex="0"><span>담기</span></div>
                </li>
            </ul>
        </div>
    </div>
</body>

</html>
