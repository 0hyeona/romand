<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>드롭다운 옵션창 커스터마이징</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/option.css" />
  </head>
  <body>
    <section class="option-demo">
      <div class="option-box">
        <p class="option-label">본품/리필/기타 정보</p>

        <div class="option-select">
          <button type="button" class="option-trigger" id="closed-trigger">
            <span class="option-color"></span>
            <span class="option-value">[필수] 옵션을 선택해주세요.</span>
            <span class="option-icon">
              <img src="./img/up.svg" alt="열기" />
            </span>
          </button>
        </div>
      </div>

      <div class="option-box is-open">
        <p class="option-label">본품/리필/기타 정보</p>

        <div class="option-select">
          <button type="button" class="option-trigger" id="open-trigger">
            <span class="option-color option-color-empty"></span>
            <span class="option-value">[필수] 옵션을 선택해주세요.</span>
            <span class="option-icon">
              <img src="./img/down.svg" alt="닫기" />
            </span>
          </button>

          <div class="option-list" id="open-list">
            <button type="button" class="option-item">
              <span class="option-color option-color-pink"></span>
              핑크
            </button>
            <button type="button" class="option-item">
              <span class="option-color option-color-light-pink"></span>
              핑크핑크
            </button>
            <button type="button" class="option-item">
              <span class="option-color option-color-dark-pink"></span>
              핑크핑크핑크
            </button>
          </div>
        </div>
      </div>

      <div class="option-box is-clicked">
        <p class="option-label">본품/리필/기타 정보</p>

        <div class="option-select">
          <button type="button" class="option-trigger" id="open-trigger">
            <span class="option-color option-color-empty"></span>
            <span class="option-value">[필수] 옵션을 선택해주세요.</span>
            <span class="option-icon">
              <img src="./img/down.svg" alt="닫기" />
            </span>
          </button>

          <div class="option-box">
            <div class="pro-name">
                <p>상품명</p>
            </div>
            <div class="pro-desc">
                <p>상품 정보</p>
            </div>
            <div class="pro-list">
                <div class="counter">
                    <img src="./img/minus.svg" alt="마이너스">
                    <span>1</span>
                    <img src="./img/plus.svg" alt="플러스">
                </div>
                <div class="price">
                    <div class="money">300,000</div>
                    <div class="won">원</div>
                </div>
            </div>
          </div>
            
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
