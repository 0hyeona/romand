<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>히어로 배너</title>
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <script src="./js/banner.js" defer></script>

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <link rel="stylesheet" href="./css/banner.css" />
  </head>
  <body>
    <main>
      <!-- 히어로배너 -->
      <div class="swiper hero-slider">
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide">
            <img
              class="pc"
              src="./img/banner1-pc.jpg"
              alt="ONLY romand 배너 디자인"
            />
            <img
              class="pad"
              src="./img/banner1-pad.jpg"
              alt="ONLY romand 배너 디자인"
            />
            <img
              class="mobile"
              src="./img/banner1-mobile.jpg"
              alt="ONLY romand 배너 디자인"
            />
          </div>
          <div class="swiper-slide">
            <img
              class="pc"
              src="./img/banner2-pc.jpg"
              alt="romand 브랜딩 배너 디자인"
            />
            <img
              class="pad"
              src="./img/banner2-pad.jpg"
              alt="romand 브랜딩 배너 디자인"
            />
            <img
              class="mobile"
              src="./img/banner2-mo.jpg"
              alt="romand 브랜딩 배너 디자인"
            />
          </div>
          <div class="swiper-slide">
            <img
              class="pc"
              src="./img/banner3-pc.jpg"
              alt="romand 신상품 배너 디자인"
            />
            <img
              class="pad"
              src="./img/banner3-pad.jpg"
              alt="romand 신상품 배너 디자인"
            />
            <img
              class="mobile"
              src="./img/banner3-mo.jpg"
              alt="romand 신상품 배너 디자인"
            />
          </div>
        </div>

        <div class="swiper-pagination"></div>
      </div>
    </main>
  </body>
</html>
