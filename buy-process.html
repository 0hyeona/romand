<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 구매 프로세스</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/btn-top.css">
    <link rel="stylesheet" href="./css/footer.css">
    <!-- 구매 프로세스 -->
    <link rel="stylesheet" href="./css/buy-process.css">

    <!-- <script src="./js/header.js" defer></script>
    <script src="./js/btn-top.js" defer></script> -->

    <!-- 스와이퍼 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

</head>

<body>
    <main>
        <div class="common-frame product-detail-layout">
            <section class="product-gallery" aria-label="상품 이미지 갤러리">
                <div class="big-img">
                    <img src="./img/buy-1.png" alt="메인 상품 이미지">
                </div>
                <div class="small-img-wrap">
                    <ul class="small-img-list" aria-label="상품 썸네일 목록">
                        <li><img src="./img/buy-2.png" alt="썸네일 이미지 1"></li>
                        <li><img src="./img/buy-3.png" alt="썸네일 이미지 2"></li>
                        <li><img src="./img/buy-4.png" alt="썸네일 이미지 3"></li>
                        <li><img src="./img/buy-5.png" alt="썸네일 이미지 4"></li>
                        <li><img src="./img/buy-6.png" alt="썸네일 이미지 5"></li>
                    </ul>
                </div>
            </section>

            <div class="product-info" aria-label="상품 정보">
                <div class="product-header">
                    <p class="product-category">LIP</p>
                    <div class="product-title-wrap">
                        <h1>메인 타이틀 입력해주세요</h1>
                        <div class="share-btn">
                            <img src="./img/share.jpg" alt="공유하기 아이콘">
                        </div>
                    </div>
                    <div class="product-price-box">
                        <div class="original-price">300,000원</div>
                        <div class="sale-row">
                            <span class="discount-rate">30%</span>
                            <span class="final-price">300,000원</span>
                        </div>
                    </div>
                </div>


                <div class="option-box">
                    <div class="product-option">본품/리필/기타 정보</div>
                </div>

                <div class="purchase-summary">
                    <p>총 금액</p>
                    <p>0원</p>
                </div>

                <div class="purchase-actions">
                    <div class="btn btn-secondary">장바구니</div>
                    <div class="btn btn-primary">구매하기</div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
