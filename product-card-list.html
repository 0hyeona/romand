<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 카드 리스트</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">

    <link rel="stylesheet" href="./css/product-card-list.css">

    <script src="./js/product-card-list.js" defer></script>
    <script src="./js/product-card-list-control.js" defer></script>
</head>

<body>
    <div class="product-card-list-wrap">
        <ul class="product-card">
            <li class="product-card-list">
                <a href="#" class="product-visual">
                    <img class="product-img" src="./img/lip-list-img-1.jpg" alt="제품 이미지">
                    <img class="product-img-model" src="./img/lip-list-model-img-1.jpg" alt="제품 모델 이미지">
                </a>
                <div class="product-txt">
                    <h2 class="product-name">쥬시 플래시 립 오일(+롬앤 립 랜덤 1종 증정)</h2>
                    <p class="price-original"><span>14,000</span>원</p>
                    <div class="discount-txt">
                        <p class="discount">22%</p>
                        <p class="price-discount"><span>10,900</span>원</p>
                    </div>
                </div>
                <div class="color-chip ">
                    <div class="color-scroll" aria-label="쥬시 플래시 립 오일(+롬앤 립 랜덤 1종 증정) 전체 컬러">
                    </div>
                </div>
                <div class="badges">
                    <span class="badge best off">BEST</span>
                    <span class="badge new on">NEW</span>
                </div>
            </li>
        </ul>
    </div>
</body>

</html>
